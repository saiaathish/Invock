name: release provenance

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: invock-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    name: build credential-free release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Validate protected release ref
        shell: bash
        env:
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "push" ]] || { echo "Release provenance requires a tag push event" >&2; exit 1; }
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || { echo "Release provenance requires a tag ref" >&2; exit 1; }
          [[ "$RELEASE_REF_PROTECTED" == "true" ]] || { echo "Release tag is not protected by a repository ruleset" >&2; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must be a semantic version such as v0.1.0" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo "Checked-out commit does not match the immutable event SHA" >&2; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tagged commit is not an ancestor of origin/main" >&2; exit 1; }
          package_version="$(node -p "require('./package.json').version")"
          [[ "$package_version" == "${GITHUB_REF_NAME#v}" ]] || { echo "Tag/package version mismatch: $GITHUB_REF_NAME vs $package_version" >&2; exit 1; }
          printf 'release_ref=%s\nrelease_commit=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" | tee release-ref.txt

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime for accessibility certification
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and archive exact containment candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          image="invock-containment-candidate:${GITHUB_SHA}"
          docker build --pull --file docker/containment.Dockerfile --tag "$image" --label "org.opencontainers.image.revision=$GITHUB_SHA" . 2>&1 | tee release-evidence/docker-build.log
          local_id="$(docker image inspect "$image" --format '{{.Id}}')"
          [[ "$local_id" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "container image ID is not a sha256 digest" >&2; exit 1; }
          docker image inspect "$image" > release-evidence/docker-image-inspect.json
          docker save --output invock-containment.tar "$image"
          sha256sum invock-containment.tar > release-evidence/candidate-image-sha256.txt
          sha256sum pnpm-lock.yaml docker/containment.Dockerfile > release-evidence/input-sha256sums.txt
          cat > release-evidence/candidate-manifest.json <<JSON
          {
            "schema": "invock/release-candidate/v1",
            "repository": "$GITHUB_REPOSITORY",
            "commit": "$GITHUB_SHA",
            "ref": "$GITHUB_REF",
            "localImageId": "$local_id",
            "candidateArchive": "invock-containment.tar"
          }
          JSON

      - name: Run release checks and generate evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          cp release-ref.txt release-evidence/release-ref.txt
          pnpm typecheck 2>&1 | tee release-evidence/typecheck.log
          pnpm lint 2>&1 | tee release-evidence/lint.log
          pnpm test 2>&1 | tee release-evidence/test.log
          pnpm build 2>&1 | tee release-evidence/build.log
          pnpm certify 2>&1 | tee release-evidence/certify.log
          pnpm mutation-review 2>&1 | tee release-evidence/mutation-review.log
          # Arena emits one complete JSON record with raw outcomes. Keep the
          # full record in the immutable artifact instead of sending a >64 KiB
          # line through the Actions log transport.
          pnpm arena > release-evidence/arena.log 2>&1
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const line = readFileSync('release-evidence/arena.log', 'utf8')
            .split(/\r?\n/u)
            .find(candidate => candidate.startsWith('{"version":2,"benchmark":"invock-arena"'));
          if (!line) throw new Error('Arena benchmark JSON is missing');
          const report = JSON.parse(line);
          if (report.benchmark !== 'invock-arena' || typeof report.deterministicDigest !== 'string' || !Number.isFinite(report.statistics?.protectedLatency?.p95)) {
            throw new Error('Measured Arena benchmark evidence is incomplete');
          }
          console.log(JSON.stringify({
            benchmark: report.benchmark,
            scenarioCount: report.metrics?.scenarioCount,
            repetitions: report.repetitions,
            protectedP95Ms: report.statistics.protectedLatency.p95,
            deterministicDigest: report.deterministicDigest,
          }));
          NODE
          pnpm accessibility:certify 2>&1 | tee release-evidence/accessibility.log
          INVOCK_CONTAINMENT_IMAGE="invock-containment-candidate:${GITHUB_SHA}" pnpm containment:certify 2>&1 | tee release-evidence/containment.log
          INVOCK_CONTAINMENT_IMAGE="invock-containment-candidate:${GITHUB_SHA}" pnpm docker-containment-test 2>&1 | tee release-evidence/docker-containment.log
          pnpm release:rehearsal 2>&1 | tee release-evidence/release-rehearsal.log
          pnpm demo:certify 2>&1 | tee release-evidence/demo.log
          pnpm audit --prod --json > release-evidence/advisory.json
          advisory_status="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('release-evidence/advisory.json', 'utf8'));
          const vulnerabilities = report?.metadata?.vulnerabilities;
          if (!vulnerabilities || typeof vulnerabilities !== 'object' || Array.isArray(vulnerabilities)) throw new Error('pnpm audit did not emit vulnerability metadata');
          const counts = Object.values(vulnerabilities);
          if (counts.some(value => typeof value !== 'number' || value !== 0)) throw new Error(`pnpm audit reported vulnerabilities: ${JSON.stringify(vulnerabilities)}`);
          process.stdout.write('queried-no-findings');
          NODE
          )"
          advisory_digest="$(node --import tsx --input-type=module -e "import { readFileSync } from 'node:fs'; import { sha256 } from './src/core/canonical.ts'; process.stdout.write(sha256(readFileSync('release-evidence/advisory.json')))" )"
          node --import tsx scripts/supply-chain.ts --sign --advisory-status "$advisory_status" --advisory-evidence "$advisory_digest" --cyclonedx-out release-evidence/sbom.cdx.json > release-evidence/supply-chain.json
          test_count="$(awk '/^# tests [0-9]+$/ { count=$3 } END { print count }' release-evidence/test.log)"
          [[ "$test_count" =~ ^[1-9][0-9]*$ ]] || { echo "Complete TAP test count missing" >&2; exit 1; }
          pnpm claim-consistency -- --test-count "$test_count" --final-verdict NOT_READY 2>&1 | tee release-evidence/claim-consistency.log
          node --import tsx --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createCycloneDx15Document, validateCycloneDx15, verifySupplyChainSignature } from './src/supplychain/index.ts';
          const report = JSON.parse(readFileSync('release-evidence/supply-chain.json', 'utf8'));
          const document = JSON.parse(readFileSync('release-evidence/sbom.cdx.json', 'utf8'));
          if (report.sbom?.bomFormat !== 'CycloneDX' || !report.sbom || report.signatureStatus !== 'verified' || report.advisoryStatus !== 'queried-no-findings' || typeof report.advisoryEvidenceDigest !== 'string' || !verifySupplyChainSignature(report)) {
            throw new Error('Verified CycloneDX supply-chain evidence is incomplete');
          }
          if (!validateCycloneDx15(document) || JSON.stringify(document) !== JSON.stringify(createCycloneDx15Document(report.sbom))) throw new Error('CycloneDX 1.5 document does not match the signed report');
          NODE

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: invock-release-candidate-${{ github.sha }}
          path: |
            release-evidence/
            invock-containment.tar
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

  publish:
    name: publish and attest approved candidate
    needs: build-candidate
    runs-on: ubuntu-latest
    environment:
      name: release-provenance
      url: https://github.com/${{ github.repository }}/attestations
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Download exact candidate from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: invock-release-candidate-${{ github.sha }}
          path: release-candidate

      - name: Validate and load candidate
        shell: bash
        working-directory: release-candidate
        run: |
          set -euo pipefail
          [[ "$(awk -F= '$1 == "release_commit" { print $2 }' release-evidence/release-ref.txt)" == "$GITHUB_SHA" ]] || { echo "Candidate commit mismatch" >&2; exit 1; }
          sha256sum --check release-evidence/candidate-image-sha256.txt
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash, createPublicKey, verify } from 'node:crypto';
          const canonicalize = value => value === null ? 'null' : typeof value === 'string' ? JSON.stringify(value) : typeof value === 'boolean' ? (value ? 'true' : 'false') : typeof value === 'number' ? JSON.stringify(value) : Array.isArray(value) ? `[${value.map(canonicalize).join(',')}]` : `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${canonicalize(value[key])}`).join(',')}}`;
          const sha256 = value => createHash('sha256').update(value).digest('base64url');
          const signingPayload = report => ({ domain: 'invock-supply-chain-report-signature-v1', schemaVersion: report.schemaVersion, root: report.root, evidenceFiles: report.evidenceFiles, dependencies: report.dependencies, resolvedDependencies: report.resolvedDependencies, resolutionStatus: report.resolutionStatus, resolutionCompleteness: report.resolutionCompleteness, dependencyEdges: report.dependencyEdges, importerSnapshots: report.importerSnapshots, lockfileMetadata: report.lockfileMetadata, sbom: report.sbom, containerReferences: report.containerReferences, lockfileStatus: report.lockfileStatus, advisoryStatus: report.advisoryStatus, ...(report.advisoryEvidenceDigest ? { advisoryEvidenceDigest: report.advisoryEvidenceDigest } : {}), signatureStatus: report.signatureStatus, claims: report.claims, reproducibleDigest: report.reproducibleDigest });
          function verifySupplyChainSignature(report) { const signature = report.signature; if (!signature || signature.algorithm !== 'Ed25519' || signature.trust !== 'self-generated-local-evidence' || signature.keyId !== sha256(signature.publicKeyPem) || signature.signedDigest !== sha256(canonicalize(signingPayload(report)))) return false; try { return verify(null, Buffer.from(canonicalize(signingPayload(report))), createPublicKey(signature.publicKeyPem), Buffer.from(signature.signature, 'base64url')); } catch { return false; } }
          function createCycloneDx15Document(sbom) { return { bomFormat: 'CycloneDX', specVersion: '1.5', serialNumber: sbom.serialNumber, version: 1, components: sbom.components.map((component, index) => ({ type: 'library', 'bom-ref': `${component.name}@${component.version}#${index}`, name: component.name, version: component.version, scope: /^(?:development|peer):/.test(component.scope) ? 'optional' : 'required', ...(component.integrity ? { hashes: [{ alg: 'SHA-512', content: component.integrity.replace(/^sha512-/u, '') }] } : {}), properties: [{ name: 'invock:evidence-scope', value: component.scope }] })) }; }
          function validateCycloneDx15(value) { return value && value.bomFormat === 'CycloneDX' && value.specVersion === '1.5' && value.version === 1 && /^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(value.serialNumber) && Array.isArray(value.components) && value.components.every(component => component && component.type === 'library' && typeof component['bom-ref'] === 'string' && typeof component.name === 'string' && typeof component.version === 'string' && ['required', 'optional', 'excluded'].includes(component.scope)); }
          const report = JSON.parse(readFileSync('release-evidence/supply-chain.json', 'utf8'));
          const document = JSON.parse(readFileSync('release-evidence/sbom.cdx.json', 'utf8'));
          if (report.sbom?.bomFormat !== 'CycloneDX' || !report.sbom || report.signatureStatus !== 'verified' || report.advisoryStatus !== 'queried-no-findings' || typeof report.advisoryEvidenceDigest !== 'string' || !verifySupplyChainSignature(report)) throw new Error('invalid signed supply-chain evidence');
          if (!validateCycloneDx15(document) || JSON.stringify(document) !== JSON.stringify(createCycloneDx15Document(report.sbom))) throw new Error('invalid or mismatched CycloneDX 1.5 document');
          NODE
          docker load --input invock-containment.tar
          docker image inspect "invock-containment-candidate:${GITHUB_SHA}" > /dev/null

      - name: Publish exact candidate by registry digest
        id: image
        shell: bash
        working-directory: release-candidate
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$image_name:${GITHUB_SHA}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "invock-containment-candidate:${GITHUB_SHA}" "$image"
          docker push "$image" 2>&1 | tee release-evidence/docker-push.log
          image_ref="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          [[ "$image_ref" == *@sha256:* ]] || { echo "Registry digest missing" >&2; exit 1; }
          digest="${image_ref##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid registry digest" >&2; exit 1; }
          printf '%s\n' "$digest" | tee release-evidence/image-digest.txt
          docker buildx imagetools inspect "$image_ref" | tee release-evidence/registry-image-inspect.txt
          printf 'image_name=%s\ndigest=%s\nimage_ref=%s\n' "$image_name" "$digest" "$image_ref" >> "$GITHUB_OUTPUT"
          cat > release-evidence/reproducibility-manifest.json <<JSON
          {
            "schema": "invock/release-reproducibility/v1",
            "repository": "$GITHUB_REPOSITORY",
            "commit": "$GITHUB_SHA",
            "ref": "$GITHUB_REF",
            "workflow": "$GITHUB_WORKFLOW",
            "runId": "$GITHUB_RUN_ID",
            "image": "$image_ref",
            "candidateArtifact": "invock-release-candidate-${GITHUB_SHA}",
            "dockerfile": "docker/containment.Dockerfile",
            "lockfile": "pnpm-lock.yaml"
          }
          JSON
          (
            cd release-evidence
            find . -type f ! -name final-sha256sums.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > final-sha256sums.txt
            sha256sum --check final-sha256sums.txt
          )

      - name: Upload final release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: invock-release-evidence-${{ github.sha }}
          path: release-candidate/release-evidence/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

      - name: Attest release evidence
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: release-candidate/release-evidence/**

      - name: Attest containment image
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Bind CycloneDX SBOM to containment image
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-name: ${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: release-candidate/release-evidence/sbom.cdx.json
          push-to-registry: true
